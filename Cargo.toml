[package]
name = "clrnet-lane"
version = "0.1.0"
edition = "2024"
authors = ["Cornell Electric Vehicles"]
license = "MIT"
description = "CLRNet lane detection on ZED frames -> lane costmap over Zenoh"

[features]
# rust-autonomy-stack builds nodes with no extra features, so the default is the Jetson build:
# libonnxruntime.so (with TensorRT + CUDA) is loaded at runtime from ORT_DYLIB_PATH.
default = ["ort-dynamic", "tensorrt", "cuda"]
ort-download = ["ort/download-binaries", "ort/tls-native", "ort/copy-dylibs"]   # laptop: --no-default-features --features ort-download
ort-dynamic = ["ort/load-dynamic"]                                              # Jetson
tensorrt = ["ort/tensorrt"]
cuda = ["ort/cuda"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = { version = "3", features = ["termination"] }
zenoh = { version = "1.10", features = ["shared-memory", "unstable"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "api-20"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
