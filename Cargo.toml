[package]
name = "lane-seg"
version = "0.1.0"
edition = "2024"
authors = ["Cornell Electric Vehicles"]
license = "MIT"
description = "ADNet lane detection on ZED frames -> lane costmap over Zenoh"

[features]
default = ["ort-download"]
# Fetch a prebuilt ONNX Runtime at build time (macOS / x86 Linux dev boxes).
ort-download = ["ort/download-binaries", "ort/tls-native", "ort/copy-dylibs"]
# Load libonnxruntime.so at runtime from ORT_DYLIB_PATH (Jetson: use an
# onnxruntime build with the TensorRT + CUDA execution providers).
ort-dynamic = ["ort/load-dynamic"]
tensorrt = ["ort/tensorrt"]
cuda = ["ort/cuda"]

[dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = { version = "3", features = ["termination"] }
zenoh = { version = "1.10", features = ["shared-memory", "unstable"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "api-20"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
