# clrnet-lane configuration. Every key is optional; defaults are shown.
# Relative paths are resolved against this file's directory.
# In rust-autonomy-stack the node reads $CEV_CAR_DIR/lane_seg.toml (cars/<car>/lane_seg.toml).

[model]
path = "../models/clrnet_r18.onnx"
# cpu, cuda, or tensorrt (Jetson; the default build has all three).
execution_provider = "cpu"
trt_fp16 = true
trt_cache_dir = "../trt_cache"
# Rows cut off the top before resizing. CLRNet's CULane config crops 270 of 590;
# match the horizon line of the ZED mount.
cut_top_fraction = 0.4576
conf_threshold = 0.4
nms_threshold = 50.0   # mean px distance (800-wide input) at which two lanes are duplicates
max_lanes = 4

[camera]
# ZED left camera at VGA. Copy the real values from
# /usr/local/zed/settings/SN<serial>.conf, section [LEFT_CAM_VGA].
fx = 264.0
fy = 264.0
cx = 336.0
cy = 188.0
# Only used where stereo depth is missing (or with ZED_READER_DEPTH_MODE=none).
height_m = 1.0
pitch_deg = 0.0

[costmap]
resolution = 0.1       # m/cell
size_x_m = 30.0        # grid is centred on the camera: 15 m ahead and behind
size_y_m = 30.0
max_range_m = 20.0
line_width_m = 0.3
fill_ego_lane = true
assumed_lane_width_m = 3.5
free_cost = 0          # nav2 FREE_SPACE
lane_cost = 254        # nav2 LETHAL_OBSTACLE (planner blocks >= 253)
unknown_cost = 255     # nav2 NO_INFORMATION

[zenoh]
# config = "zenoh.json5"
costmap_key = "cev/perception/lane_costmap"
depth_wait_ms = 20
