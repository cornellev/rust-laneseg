# lane-seg configuration. Every key is optional; defaults are shown.
# Relative paths are resolved against this file's directory.

[model]
# Drop the two files from tools/export_adnet_onnx.py here.
backbone = "../models/adnet_backbone.onnx"
roi_head = "../models/adnet_roi_head.onnx"
# cpu (laptop), cuda, or tensorrt (Jetson; build with --features tensorrt,cuda).
execution_provider = "cpu"
trt_fp16 = true
trt_cache_dir = "../trt_cache"
# Rows cut off the top before resizing. ADNet was trained on CULane with the
# top 46% (sky) removed; match the horizon line of the ZED mount.
cut_top_fraction = 0.35
conf_threshold = 0.3
nms_threshold = 45.0   # mean px distance at which two lanes are duplicates
max_lanes = 5

[camera]
# ZED left camera at VGA. Copy the real values from
# /usr/local/zed/settings/SN<serial>.conf, section [LEFT_CAM_VGA].
fx = 264.0
fy = 264.0
cx = 336.0
cy = 188.0
# Only used where stereo depth is missing (or with ZED_READER_DEPTH_MODE=none).
height_m = 1.0
pitch_deg = 0.0

[costmap]
resolution = 0.1       # m/cell
size_x_m = 30.0        # grid is centred on the camera: 15 m ahead and behind
size_y_m = 30.0
max_range_m = 20.0
line_width_m = 0.3
fill_ego_lane = true
assumed_lane_width_m = 3.5
free_cost = 0          # nav2 FREE_SPACE
lane_cost = 254        # nav2 LETHAL_OBSTACLE (planner blocks >= 253)
unknown_cost = 255     # nav2 NO_INFORMATION

[zenoh]
# config = "zenoh.json5"
costmap_key = "perception/lane_costmap"
depth_wait_ms = 20
